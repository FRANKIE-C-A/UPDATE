<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>FRANKIE'S FOLDER</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js">
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e1a;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #141b2b;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #f472b6, #8b5cf6);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #ec4899, #7c3aed);
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            border-bottom: 2px solid rgba(244, 114, 182, 0.25);
            box-shadow: 0 4px 30px rgba(139, 92, 246, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .header-left .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #f472b6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f472b6, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 small {
            display: block;
            font-size: 0.55rem;
            font-weight: 400;
            -webkit-text-fill-color: #94a3b8;
            color: #94a3b8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: -2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-right .status-badge {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.15), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-right .status-badge i {
            color: #34d399;
            font-size: 0.5rem;
        }

        .header-right .clock {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 300;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .about-bar {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(244, 114, 182, 0.05));
            padding: 0.7rem 1.5rem;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #c4b5fd;
            backdrop-filter: blur(4px);
        }

        .about-bar i {
            color: #f472b6;
            font-size: 1rem;
        }

        .about-bar strong {
            color: #e2e8f0;
            font-weight: 600;
        }

        .about-bar .about-text {
            background: linear-gradient(135deg, #f472b6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 500;
        }

        .storage-meter {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 27, 75, 0.8));
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .storage-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .storage-info .label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .storage-info .label i {
            color: #8b5cf6;
        }

        .storage-info .used-text {
            font-weight: 600;
            color: #e2e8f0;
            font-variant-numeric: tabular-nums;
        }

        .storage-bar {
            width: 100%;
            height: 6px;
            background: rgba(148, 163, 184, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .storage-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease, background 0.5s ease;
            background: linear-gradient(90deg, #34d399, #10b981);
        }

        .storage-bar .fill.warning {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }

        .storage-bar .fill.danger {
            background: linear-gradient(90deg, #f472b6, #ec4899);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.2rem 1.2rem 2rem;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 820px) {
            .upload-section {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }

        .upload-card {
            background: linear-gradient(145deg, #141b2b, #0f172a);
            border-radius: 16px;
            padding: 1.4rem 1.5rem;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .upload-card:hover {
            border-color: rgba(139, 92, 246, 0.35);
            box-shadow: 0 8px 40px rgba(139, 92, 246, 0.08);
        }

        .upload-card h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #e2e8f0;
        }

        .upload-card h3 i {
            background: linear-gradient(135deg, #f472b6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.2rem;
        }

        .upload-card h3 .sub {
            font-size: 0.7rem;
            font-weight: 400;
            -webkit-text-fill-color: #94a3b8;
            color: #94a3b8;
            background: rgba(148, 163, 184, 0.08);
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
        }

        .form-group {
            margin-bottom: 0.9rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.3rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .form-group label i {
            margin-right: 0.3rem;
            color: #8b5cf6;
        }

        .form-group input[type="text"],
        .form-group input[type="url"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1.5px solid rgba(139, 92, 246, 0.15);
            border-radius: 10px;
            font-size: 0.9rem;
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
            transition: border 0.25s, box-shadow 0.25s;
            outline: none;
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: #475569;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }

        .form-group input[type="file"] {
            padding: 0.5rem 0.8rem;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
        }

        .form-group input[type="file"]::file-selector-button {
            padding: 0.3rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 1rem;
        }

        .form-group input[type="file"]::file-selector-button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .btn {
            padding: 0.65rem 1.6rem;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(244, 114, 182, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(139, 92, 246, 0.25);
            color: #a78bfa;
        }

        .btn-outline:hover {
            background: rgba(139, 92, 246, 0.08);
            border-color: #8b5cf6;
        }

        .btn-sm {
            padding: 0.35rem 0.9rem;
            font-size: 0.7rem;
            border-radius: 8px;
        }

        .btn-xs {
            padding: 0.2rem 0.6rem;
            font-size: 0.65rem;
            border-radius: 6px;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-link {
            background: transparent;
            border: none;
            color: #a78bfa;
            font-weight: 500;
            font-size: 0.75rem;
            padding: 0.2rem 0.4rem;
            cursor: pointer;
            transition: color 0.2s;
            font-family: inherit;
        }

        .btn-link:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }

        .btn-link.danger {
            color: #f472b6;
        }

        .btn-link.danger:hover {
            color: #ec4899;
        }

        .file-info {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.3rem;
            padding: 0.2rem 0.6rem;
            background: rgba(148, 163, 184, 0.06);
            border-radius: 6px;
            display: inline-block;
            border: 1px solid rgba(148, 163, 184, 0.05);
        }

        .upload-progress {
            margin-top: 0.6rem;
            font-size: 0.8rem;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .upload-progress .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(139, 92, 246, 0.15);
            border-radius: 10px;
            overflow: hidden;
        }

        .upload-progress .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f472b6, #8b5cf6, #60a5fa);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(139, 92, 246, 0.1);
        }

        .section-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .section-header h2 i {
            background: linear-gradient(135deg, #f472b6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-header .count {
            background: rgba(139, 92, 246, 0.12);
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.1);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
                gap: 0.8rem;
            }
        }

        .item-card {
            background: linear-gradient(145deg, #141b2b, #0f172a);
            border-radius: 14px;
            padding: 1rem 1rem 0.8rem;
            border: 1px solid rgba(139, 92, 246, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 8px 40px rgba(139, 92, 246, 0.08);
        }

        .item-card .icon-wrapper {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.6rem;
            flex-shrink: 0;
        }

        .item-card .icon-wrapper.file-icon {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.05));
            color: #a78bfa;
        }

        .item-card .icon-wrapper.link-icon {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.2), rgba(52, 211, 153, 0.05));
            color: #34d399;
        }

        .item-card .icon-wrapper.img-icon {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.2), rgba(244, 114, 182, 0.05));
            color: #f472b6;
        }

        .item-card .card-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: #e2e8f0;
            margin-bottom: 0.15rem;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .item-card .card-meta {
            font-size: 0.65rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.1rem;
        }

        .item-card .card-meta .type-badge {
            background: rgba(139, 92, 246, 0.1);
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.05);
        }

        .item-card .file-size {
            font-size: 0.6rem;
            color: #64748b;
            margin-top: 0.1rem;
        }

        .item-card .card-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.7rem;
            flex-wrap: wrap;
            border-top: 1px solid rgba(139, 92, 246, 0.06);
            padding-top: 0.6rem;
        }

        .item-card .card-actions .btn {
            flex: 1;
            min-width: 40px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1.5rem;
            color: #64748b;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 16px;
            border: 1px dashed rgba(139, 92, 246, 0.15);
        }

        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #f472b6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            color: #e2e8f0;
            margin-bottom: 0.2rem;
        }

        .empty-state p {
            font-size: 0.85rem;
            color: #64748b;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(139, 92, 246, 0.1);
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 380px;
            width: 100%;
        }

        @media (max-width: 480px) {
            .toast-container {
                left: 0.8rem;
                right: 0.8rem;
                bottom: 0.8rem;
                max-width: none;
            }
        }

        .toast {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            color: #e2e8f0;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            animation: slideUp 0.35s ease;
            border-left: 4px solid #8b5cf6;
            backdrop-filter: blur(8px);
        }

        .toast.success {
            border-left-color: #34d399;
        }

        .toast.error {
            border-left-color: #f472b6;
        }

        .toast i {
            font-size: 1.1rem;
        }

        .toast.success i {
            color: #34d399;
        }

        .toast.error i {
            color: #f472b6;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #141b2b, #0f172a);
            border-radius: 16px;
            max-width: 820px;
            width: 100%;
            max-height: 92vh;
            overflow: auto;
            padding: 1.2rem;
            position: relative;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
            animation: zoomIn 0.25s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content .modal-close {
            position: absolute;
            top: 0.6rem;
            right: 0.8rem;
            background: rgba(239, 68, 68, 0.1);
            border: none;
            font-size: 1.6rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal-content .modal-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #f472b6;
            transform: rotate(90deg);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 70vh;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.05);
        }

        .modal-content .modal-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.6rem;
            color: #e2e8f0;
            text-align: center;
            background: linear-gradient(135deg, #f472b6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-content .modal-actions {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .modal-content iframe,
        .modal-content .pdf-viewer {
            width: 100%;
            height: 60vh;
            border: none;
            border-radius: 8px;
            background: #0b0e1a;
        }

        .modal-content .pdf-viewer {
            height: 70vh;
        }

<body>

    <header class="header">
        <div class="header-left">
            <div class="logo-icon"><i class="fas fa-folder-open"></i></div>
            <div>
                <h1>FRANKIE'S FOLDER
                    <small><i class="fas fa-globe" style="margin-right:4px;"></i> ACCESS ANYWHERE AND EVERYWHERE</small>
                </h1>
            </div>
        </div>
        <div class="header-right">
            <span class="status-badge hidden-badge">
                <i class="fas fa-circle"></i> Live
            </span>
            <span class="clock" id="liveTime"><i class="far fa-clock"></i> loading...</span>
        </div>
    </header>

    <div class="about-bar">
        <i class="fas fa-circle-info"></i>
        <strong>About:</strong>
        <span class="about-text">THIS SITE IS USED FOR STORING AND UPLOADING FILES AND ETC..</span>
        <span style="margin-left:auto; font-size:0.7rem; color:#475569; display:flex; align-items:center; gap:0.3rem; display:none;">
            <i class="fas fa-database" style="color:#8b5cf6;"></i> Firebase
        </span>
    </div>

    <div class="storage-meter">
        <div class="storage-info">
            <span class="label"><i class="fas fa-hdd"></i> Storage Used</span>
            <span class="used-text" id="storageText">0.00 B / 5.00 GB</span>
        </div>
        <div class="storage-bar">
            <div class="fill" id="storageFill" style="width: 0%;"></div>
        </div>
    </div>

    <div class="container">

        <div class="upload-section">

            <div class="upload-card">
                <h3><i class="fas fa-upload"></i> Upload File <span class="sub">DOC, TXT, PPT, IMG, JPG & more</span></h3>
                <form id="fileUploadForm" autocomplete="off">
                    <div class="form-group">
                        <label for="fileTitle"><i class="fas fa-tag"></i> Title</label>
                        <input type="text" id="fileTitle" placeholder="Give your file a name..." required />
                    </div>
                    <div class="form-group">
                        <label for="fileInput"><i class="fas fa-paperclip"></i> Choose File</label>
                        <input type="file" id="fileInput" required />
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="uploadFileBtn">
                        <i class="fas fa-cloud-upload-alt"></i> Upload File
                    </button>
                </form>
                <div class="upload-progress" id="fileUploadProgress" style="display:none;">
                    <span id="fileProgressText">0%</span>
                    <div class="progress-bar">
                        <div class="fill" id="fileProgressFill"></div>
                    </div>
                </div>
            </div>

            <div class="upload-card">
                <h3><i class="fas fa-link"></i> Add Link <span class="sub">URLs, bookmarks, references</span></h3>
                <form id="linkForm" autocomplete="off">
                    <div class="form-group">
                        <label for="linkTitle"><i class="fas fa-tag"></i> Title</label>
                        <input type="text" id="linkTitle" placeholder="Name this link..." required />
                    </div>
                    <div class="form-group">
                        <label for="linkUrl"><i class="fas fa-globe"></i> URL</label>
                        <input type="url" id="linkUrl" placeholder="https://example.com" required />
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="addLinkBtn">
                        <i class="fas fa-plus-circle"></i> Add Link
                    </button>
                </form>
                <div class="upload-progress" id="linkAddProgress" style="display:none;">
                    <span id="linkProgressText">Adding...</span>
                    <div class="progress-bar">
                        <div class="fill" id="linkProgressFill" style="width:100%;"></div>
                    </div>
                </div>
            </div>

        </div>

        <div class="section-header">
            <h2><i class="fas fa-list-ul"></i> Your Items</h2>
            <span class="count" id="itemCount">0 items</span>
        </div>

        <div id="itemsGrid" class="items-grid">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC3JbrOoBXTtDNH-7tDbCzT6tECKJCtdjE",
            authDomain: "hacked-wifi-3d8ac.firebaseapp.com",
            projectId: "hacked-wifi-3d8ac",
            storageBucket: "hacked-wifi-3d8ac.firebasestorage.app",
            messagingSenderId: "893227799683",
            appId: "1:893227799683:web:7f7a63cc80fea8284a77b6",
            measurementId: "G-STXY8VVBLZ"
        };

        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) {
            console.warn('Firebase init warning:', e);
        }
        const db = firebase.firestore();
        const storage = firebase.storage();

        let allItems = [];
        let isLoading = true;
        let currentTotalBytes = 0;
        const MAX_BYTES = 5 * 1024 * 1024 * 1024;

        const itemsGrid = document.getElementById('itemsGrid');
        const itemCount = document.getElementById('itemCount');
        const toastContainer = document.getElementById('toastContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBody = document.getElementById('modalBody');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        const fileUploadForm = document.getElementById('fileUploadForm');
        const fileTitle = document.getElementById('fileTitle');
        const fileInput = document.getElementById('fileInput');
        const uploadFileBtn = document.getElementById('uploadFileBtn');
        const fileUploadProgress = document.getElementById('fileUploadProgress');
        const fileProgressText = document.getElementById('fileProgressText');
        const fileProgressFill = document.getElementById('fileProgressFill');

        const linkForm = document.getElementById('linkForm');
        const linkTitle = document.getElementById('linkTitle');
        const linkUrl = document.getElementById('linkUrl');
        const addLinkBtn = document.getElementById('addLinkBtn');
        const linkAddProgress = document.getElementById('linkAddProgress');
        const linkProgressText = document.getElementById('linkProgressText');
        const linkProgressFill = document.getElementById('linkProgressFill');

        const storageText = document.getElementById('storageText');
        const storageFill = document.getElementById('storageFill');

        function showToast(message, type = 'info', duration = 4500) {
            const iconMap = {
                info: 'fa-circle-info',
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle'
            };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 350);
            }, duration);
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            const val = bytes / Math.pow(k, i);
            return parseFloat(val.toFixed(i === 0 ? 0 : 2)) + ' ' + sizes[i];
        }

        function formatSmart(bytes) {
            if (bytes === 0) return { value: 0, unit: 'B', scaled: 0 };
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            const val = bytes / Math.pow(k, i);
            return {
                value: parseFloat(val.toFixed(i === 0 ? 0 : 2)),
                unit: sizes[i],
                scaled: val
            };
        }

        function getFileIcon(mimeType, fileName) {
            const ext = fileName ? fileName.split('.').pop().toLowerCase() : '';
            if (mimeType && mimeType.startsWith('image/')) return 'fa-image';
            if (mimeType && mimeType.startsWith('video/')) return 'fa-video';
            if (mimeType && mimeType.startsWith('audio/')) return 'fa-music';
            if (mimeType === 'application/pdf') return 'fa-file-pdf';
            if (['doc', 'docx'].includes(ext)) return 'fa-file-word';
            if (['ppt', 'pptx'].includes(ext)) return 'fa-file-powerpoint';
            if (['xls', 'xlsx'].includes(ext)) return 'fa-file-excel';
            if (['txt'].includes(ext)) return 'fa-file-alt';
            if (['zip', 'rar', '7z'].includes(ext)) return 'fa-file-archive';
            return 'fa-file';
        }

        function getFileTypeLabel(mimeType, fileName) {
            const ext = fileName ? fileName.split('.').pop().toLowerCase() : '';
            if (mimeType && mimeType.startsWith('image/')) return 'Image';
            if (mimeType && mimeType.startsWith('video/')) return 'Video';
            if (mimeType && mimeType.startsWith('audio/')) return 'Audio';
            if (mimeType === 'application/pdf') return 'PDF';
            if (['doc', 'docx'].includes(ext)) return 'DOC';
            if (['ppt', 'pptx'].includes(ext)) return 'PPT';
            if (['xls', 'xlsx'].includes(ext)) return 'XLS';
            if (['txt'].includes(ext)) return 'TXT';
            if (['zip', 'rar', '7z'].includes(ext)) return 'Archive';
            return ext.toUpperCase() || 'File';
        }

        function getIconColor(type) {
            if (type === 'link') return 'link-icon';
            if (type === 'image') return 'img-icon';
            return 'file-icon';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStorageUI() {
            const usedInfo = formatSmart(currentTotalBytes);
            const maxInfo = formatSmart(MAX_BYTES);

            let displayUsed = usedInfo.value + ' ' + usedInfo.unit;
            let displayMax = maxInfo.value + ' ' + maxInfo.unit;

            if (usedInfo.unit !== maxInfo.unit) {
                const maxScaled = MAX_BYTES / Math.pow(1024, ['B', 'KB', 'MB', 'GB'].indexOf(usedInfo.unit));
                displayMax = maxScaled.toFixed(2) + ' ' + usedInfo.unit;
                if (usedInfo.unit === 'GB') {
                    displayMax = maxInfo.value + ' ' + maxInfo.unit;
                }
            }

            if (usedInfo.unit === 'GB' && maxInfo.unit === 'GB') {
                displayUsed = usedInfo.value.toFixed(2) + ' GB';
                displayMax = maxInfo.value.toFixed(2) + ' GB';
            }

            if (usedInfo.unit === 'B' && maxInfo.unit === 'GB') {
                displayUsed = usedInfo.value + ' B';
                displayMax = (MAX_BYTES / 1024 / 1024 / 1024).toFixed(2) + ' GB';
            }

            storageText.innerText = displayUsed + ' / ' + displayMax;

            const percent = Math.min((currentTotalBytes / MAX_BYTES) * 100, 100);
            storageFill.style.width = percent + '%';
            storageFill.classList.remove('warning', 'danger');
            if (percent > 90) {
                storageFill.classList.add('danger');
            } else if (percent > 70) {
                storageFill.classList.add('warning');
            }
        }

        async function initStorage() {
            try {
                const docRef = db.collection('metadata').doc('storageUsage');
                const doc = await docRef.get();
                if (doc.exists) {
                    currentTotalBytes = doc.data().totalBytes || 0;
                } else {
                    await docRef.set({ totalBytes: 0 });
                    currentTotalBytes = 0;
                }
                updateStorageUI();
            } catch (error) {
                console.error('Storage init error:', error);
                showToast('Could not load storage info.', 'error');
            }
        }

        function renderItems(items) {
            if (isLoading) {
                itemsGrid.innerHTML = `
                            <div class="loading-spinner">
                                <div class="spinner"></div>
                            </div>
                        `;
                return;
            }

            if (!items || items.length === 0) {
                itemsGrid.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-folder-open"></i>
                                <h3>Your folder is empty</h3>
                                <p>Upload a file or add a link to get started!</p>
                            </div>
                        `;
                itemCount.textContent = '0 items';
                return;
            }

            let html = '';
            items.forEach(item => {
                const isLink = item.type === 'link';
                const iconClass = isLink ? 'fa-link' : getFileIcon(item.mimeType, item.fileName);
                const iconWrapperClass = isLink ? 'link-icon' : getIconColor(item.type === 'image' ? 'image' :
                'file');
                const typeLabel = isLink ? 'Link' : getFileTypeLabel(item.mimeType, item.fileName);
                const sizeText = isLink ? '' : formatFileSize(item.fileSize || 0);

                let primaryAction = '';
                let primaryIcon = '';
                if (isLink) {
                    primaryAction = `onclick="visitLink('${item.id}')"`;
                    primaryIcon = 'fa-arrow-up-right-from-square';
                } else if (item.mimeType && item.mimeType.startsWith('image/')) {
                    primaryAction = `onclick="previewImage('${item.id}')"`;
                    primaryIcon = 'fa-eye';
                } else {
                    primaryAction = `onclick="viewFile('${item.id}')"`;
                    primaryIcon = 'fa-eye';
                }

                const dateStr = item.timestamp?.toMillis?.() ?
                    new Date(item.timestamp.toMillis()).toLocaleDateString() :
                    item.timestamp ? new Date(item.timestamp).toLocaleDateString() :
                    '';

                html += `
                            <div class="item-card" data-id="${item.id}">
                                <div class="icon-wrapper ${iconWrapperClass}">
                                    <i class="fas ${iconClass}"></i>
                                </div>
                                <div class="card-title">${escapeHtml(item.title)}</div>
                                <div class="card-meta">
                                    <span class="type-badge">${typeLabel}</span>
                                    ${sizeText ? `<span>• ${sizeText}</span>` : ''}
                                    ${dateStr ? `<span>• ${dateStr}</span>` : ''}
                                </div>
                                <div class="card-actions">
                                    <button class="btn btn-primary btn-sm" ${primaryAction}>
                                        <i class="fas ${primaryIcon}"></i> ${isLink ? 'Visit' : 'View'}
                                    </button>
                                    ${!isLink ? `
                                        <button class="btn btn-outline btn-sm" onclick="downloadFile('${item.id}')">
                                            <i class="fas fa-download"></i>
                                        </button>
                                    ` : ''}
                                    <button class="btn-link danger btn-xs" onclick="deleteItem('${item.id}')">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                        `;
            });

            itemsGrid.innerHTML = html;
            itemCount.textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;
        }

        async function fetchItems() {
            isLoading = true;
            renderItems([]);
            try {
                const snapshot = await db.collection('items')
                    .orderBy('timestamp', 'desc')
                    .get();

                allItems = [];
                snapshot.forEach(doc => {
                    allItems.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                isLoading = false;
                renderItems(allItems);
            } catch (error) {
                console.error('Fetch error:', error);
                isLoading = false;
                showToast('Failed to load items: ' + error.message, 'error');
                itemsGrid.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-triangle-exclamation" style="color:#f472b6; -webkit-text-fill-color:#f472b6;"></i>
                                <h3 style="color:#e2e8f0;">Error loading items</h3>
                                <p>${escapeHtml(error.message)}</p>
                                <button class="btn btn-primary btn-sm" style="margin-top:0.8rem;" onclick="fetchItems()">
                                    <i class="fas fa-sync-alt"></i> Retry
                                </button>
                            </div>
                        `;
            }
        }

        fileUploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = fileTitle.value.trim();
            const file = fileInput.files[0];
            if (!title) { showToast('Please enter a title.', 'error'); return; }
            if (!file) { showToast('Please select a file.', 'error'); return; }

            if (currentTotalBytes + file.size > MAX_BYTES) {
                showToast(`Storage limit exceeded! Cannot upload "${file.name}".`, 'error');
                return;
            }

            uploadFileBtn.disabled = true;
            uploadFileBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            fileUploadProgress.style.display = 'flex';
            fileProgressText.textContent = '0%';
            fileProgressFill.style.width = '0%';

            try {
                const storageRef = storage.ref('files/' + Date.now() + '_' + file.name);
                const uploadTask = storageRef.put(file);

                uploadTask.on('state_changed',
                    (snapshot) => {
                        const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                        fileProgressText.textContent = progress + '%';
                        fileProgressFill.style.width = progress + '%';
                    },
                    (error) => {
                        throw error;
                    }
                );

                await uploadTask;
                const downloadURL = await storageRef.getDownloadURL();

                const docData = {
                    title: title,
                    type: 'file',
                    fileName: file.name,
                    mimeType: file.type || 'application/octet-stream',
                    fileSize: file.size,
                    storagePath: storageRef.fullPath,
                    downloadURL: downloadURL,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection('items').add(docData);

                currentTotalBytes += file.size;
                await db.collection('metadata').doc('storageUsage').set({ totalBytes: currentTotalBytes });
                updateStorageUI();

                showToast(`✅ "${title}" uploaded successfully!`, 'success');
                fileUploadForm.reset();
                fileUploadProgress.style.display = 'none';
                await fetchItems();

            } catch (error) {
                console.error('Upload error:', error);
                showToast('❌ Upload failed: ' + error.message, 'error');
                fileProgressText.textContent = '❌ Failed';
                fileProgressFill.style.width = '100%';
                fileProgressFill.style.background = 'linear-gradient(90deg, #f472b6, #ec4899)';
                setTimeout(() => {
                    fileUploadProgress.style.display = 'none';
                    fileProgressFill.style.background = 'linear-gradient(90deg, #f472b6, #8b5cf6, #60a5fa)';
                }, 3000);
            } finally {
                uploadFileBtn.disabled = false;
                uploadFileBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload File';
            }
        });

        linkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = linkTitle.value.trim();
            const url = linkUrl.value.trim();
            if (!title) { showToast('Please enter a title.', 'error'); return; }
            if (!url) { showToast('Please enter a URL.', 'error'); return; }

            addLinkBtn.disabled = true;
            addLinkBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';
            linkAddProgress.style.display = 'flex';
            linkProgressText.textContent = 'Adding link...';

            try {
                await db.collection('items').add({
                    title: title,
                    type: 'link',
                    url: url,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast(`✅ "${title}" added successfully!`, 'success');
                linkForm.reset();
                linkAddProgress.style.display = 'none';
                await fetchItems();

            } catch (error) {
                console.error('Add link error:', error);
                showToast('❌ Failed to add link: ' + error.message, 'error');
                linkProgressText.textContent = '❌ Failed';
                setTimeout(() => {
                    linkAddProgress.style.display = 'none';
                }, 2500);
            } finally {
                addLinkBtn.disabled = false;
                addLinkBtn.innerHTML = '<i class="fas fa-plus-circle"></i> Add Link';
            }
        });

        window.visitLink = function(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) { showToast('Item not found.', 'error'); return; }
            if (item.url) {
                window.open(item.url, '_blank');
            } else {
                showToast('No URL found.', 'error');
            }
        };

        window.previewImage = function(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) { showToast('Item not found.', 'error'); return; }
            if (!item.downloadURL) {
                showToast('No image URL found.', 'error');
                return;
            }
            modalBody.innerHTML = `
                        <div class="modal-title">${escapeHtml(item.title)}</div>
                        <img src="${item.downloadURL}" alt="${escapeHtml(item.title)}" />
                        <div class="modal-actions">
                            <button class="btn btn-primary btn-sm" onclick="downloadFile('${item.id}')">
                                <i class="fas fa-download"></i> Download
                            </button>
                            <button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>
                        </div>
                    `;
            modalOverlay.classList.add('active');
        };

        window.viewFile = function(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) { showToast('Item not found.', 'error'); return; }
            if (!item.downloadURL) {
                showToast('No file URL found.', 'error');
                return;
            }
            const mime = item.mimeType || '';
            const isImage = mime.startsWith('image/');
            const isPDF = mime === 'application/pdf';

            if (isImage) {
                previewImage(id);
                return;
            }

            if (isPDF) {
                modalBody.innerHTML = `
                            <div class="modal-title">${escapeHtml(item.title)}</div>
                            <iframe class="pdf-viewer" src="${item.downloadURL}#toolbar=1" allowfullscreen></iframe>
                            <div class="modal-actions">
                                <button class="btn btn-primary btn-sm" onclick="downloadFile('${item.id}')">
                                    <i class="fas fa-download"></i> Download
                                </button>
                                <button class="btn btn-outline btn-sm" onclick="closeModal()">Close</button>
                            </div>
                        `;
                modalOverlay.classList.add('active');
                return;
            }

            window.open(item.downloadURL, '_blank');
        };

        window.downloadFile = function(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) { showToast('Item not found.', 'error'); return; }
            if (!item.downloadURL) {
                showToast('No download URL available.', 'error');
                return;
            }
            window.open(item.downloadURL, '_blank');
            showToast(`📂 Opening "${item.title}"... (right-click to save)`, 'success');
        };

        window.deleteItem = async function(id) {
            if (!confirm('Delete this item permanently?')) return;
            try {
                const item = allItems.find(i => i.id === id);
                if (item && item.type === 'file' && item.storagePath) {
                    try {
                        await storage.ref(item.storagePath).delete();
                    } catch (e) {
                        console.warn('Storage delete failed:', e);
                    }
                }
                await db.collection('items').doc(id).delete();

                if (item && item.type === 'file' && item.fileSize) {
                    currentTotalBytes -= item.fileSize;
                    if (currentTotalBytes < 0) currentTotalBytes = 0;
                    await db.collection('metadata').doc('storageUsage').set({ totalBytes: currentTotalBytes });
                    updateStorageUI();
                }

                showToast('🗑️ Item deleted.', 'success');
                await fetchItems();
            } catch (error) {
                console.error('Delete error:', error);
                showToast('Delete failed: ' + error.message, 'error');
            }
        };

        function closeModal() {
            modalOverlay.classList.remove('active');
        }
        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('liveTime').textContent =
                now.toLocaleString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    month: 'short',
                    day: 'numeric'
                });
        }
        updateClock();
        setInterval(updateClock, 1000);

        if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
            itemsGrid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1; padding:2.5rem 1rem;">
                            <i class="fas fa-triangle-exclamation" style="color:#f472b6; font-size:3rem; -webkit-text-fill-color:#f472b6;"></i>
                            <h3 style="color:#e2e8f0;">Firebase Not Configured</h3>
                            <p style="color:#94a3b8; max-width:450px; margin:0.3rem auto;">
                                Please replace the <code style="background:rgba(148,163,184,0.1);padding:0.1rem 0.4rem;border-radius:4px;color:#a78bfa;">firebaseConfig</code> object with your own credentials.
                            </p>
                        </div>
                    `;
        } else {
            initStorage();
            fetchItems();
        }

        console.log('FRANKIE\'S FOLDER ready!');
    </script>

</body>
</html>
