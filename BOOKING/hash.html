<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHA-256 Hash Generator</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            background: #0a1a0a;
            border: 2px solid #00ff41;
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0,255,0,0.3);
        }
        h1 {
            color: #00ff41;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px #00ff41;
        }
        .subtitle {
            color: #8f8;
            text-align: center;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }
        label {
            display: block;
            color: #00ff41;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            background: #000;
            border: 1px solid #00ff41;
            border-radius: 1rem;
            color: #00ff41;
            font-size: 1rem;
            font-family: monospace;
            outline: none;
            transition: 0.3s;
        }
        input[type="password"]:focus {
            box-shadow: 0 0 15px #00ff41;
        }
        .btn {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            background: #00ff41;
            color: #000;
            border: none;
            border-radius: 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            transition: 0.3s;
        }
        .btn:hover {
            background: #0c0;
            box-shadow: 0 0 20px #00ff41;
        }
        .result-box {
            margin-top: 1.5rem;
            background: #000;
            border: 1px solid #00ff41;
            border-radius: 1rem;
            padding: 1rem;
            color: #00ff41;
            font-size: 0.75rem;
            word-break: break-all;
            min-height: 60px;
            display: none;
        }
        .result-box.visible {
            display: block;
        }
        .result-box .label {
            color: #8f8;
            font-size: 0.7rem;
            margin-bottom: 0.3rem;
        }
        .copy-btn {
            margin-top: 0.5rem;
            background: #00ff41;
            color: #000;
            border: none;
            border-radius: 1rem;
            padding: 0.3rem 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }
        .copy-btn:hover {
            background: #0c0;
        }
        .info {
            color: #888;
            font-size: 0.7rem;
            margin-top: 1rem;
            text-align: center;
            border-top: 1px solid #333;
            padding-top: 1rem;
        }
        .info code {
            color: #00ff41;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 SHA‑256</h1>
        <p class="subtitle">Password Hash Generator for Firestore</p>

        <label for="passwordInput">Enter Password:</label>
        <input type="password" id="passwordInput" placeholder="Type your password..." autocomplete="off">

        <button class="btn" id="generateBtn">⚡ Generate Hash</button>

        <div class="result-box" id="resultBox">
            <div class="label">📋 SHA‑256 Hash (copy this into Firestore):</div>
            <div id="hashOutput" style="color:#00ff41; font-size:0.8rem;"></div>
            <button class="copy-btn" id="copyBtn">📄 Copy to Clipboard</button>
        </div>

        <div class="info">
            💡 The hash generated here matches what the login page expects.<br>
            Store it in Firestore under the <code>password</code> field for any user.
        </div>
    </div>

    <script>
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const passwordInput = document.getElementById('passwordInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultBox = document.getElementById('resultBox');
        const hashOutput = document.getElementById('hashOutput');
        const copyBtn = document.getElementById('copyBtn');

        generateBtn.addEventListener('click', async function() {
            const password = passwordInput.value.trim();
            if (!password) {
                alert('Please enter a password.');
                return;
            }
            const hash = await hashPassword(password);
            hashOutput.textContent = hash;
            resultBox.classList.add('visible');
        });

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                generateBtn.click();
            }
        });

        copyBtn.addEventListener('click', function() {
            const hash = hashOutput.textContent;
            if (!hash) return;
            navigator.clipboard.writeText(hash).then(function() {
                copyBtn.textContent = '✅ Copied!';
                setTimeout(function() {
                    copyBtn.textContent = '📄 Copy to Clipboard';
                }, 2000);
            }).catch(function() {
                const textarea = document.createElement('textarea');
                textarea.value = hash;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyBtn.textContent = '✅ Copied!';
                setTimeout(function() {
                    copyBtn.textContent = '📄 Copy to Clipboard';
                }, 2000);
            });
        });
    </script>
</body>
</html>
