<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-title" id="homeLink">
                <i class="fas fa-bus"></i> Bus<span style="-webkit-text-fill-color: #ffd700;">Book</span>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <button class="hamburger" id="homeBtn">
                    <i class="fas fa-home"></i>
                </button>
            </div>
        </header>

        <div class="card glass" style="max-width:480px; margin:0 auto;">
            <h2><i class="fas fa-user-lock" style="color:#7aa9ff;"></i> Login</h2>
            <p class="sub" style="color:rgba(255,255,255,0.5); margin-bottom:20px;">Select your role and enter credentials</p>

            <!-- Role Selection Buttons -->
            <div class="login-role-grid">
                <button class="login-role-btn" data-role="admin">
                    <i class="fas fa-user-shield"></i> Admin
                </button>
                <button class="login-role-btn" data-role="driver">
                    <i class="fas fa-steering-wheel"></i> Driver
                </button>
                <button class="login-role-btn" data-role="user">
                    <i class="fas fa-user"></i> User
                </button>
                <button class="login-role-btn" data-role="owner">
                    <i class="fas fa-crown"></i> Owner
                </button>
            </div>

            <!-- Login Form (default) -->
            <div id="loginFormContainer">
                <!-- User Fields -->
                <div id="userFields" style="display:none;">
                    <div class="login-form-group">
                        <input id="loginUsername" type="text" placeholder="Enter your username" />
                    </div>
                    <div class="login-form-group">
                        <input id="loginPassword" type="password" placeholder="Enter your password" />
                    </div>
                </div>

                <!-- Special Code Field (Admin/Driver/Owner) -->
                <div id="codeFields" style="display:none;">
                    <div class="login-form-group">
                        <input id="loginCode" type="password" placeholder="Enter your access code" />
                    </div>
                </div>

                <button class="btn-primary" id="loginBtn" style="width:100%; margin-top:12px;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <div id="loginError" class="error-msg" style="text-align:center; margin-top:10px;"></div>

                <div id="signupLink" style="text-align:center; margin-top:16px; font-size:0.85rem; color:rgba(255,255,255,0.3);">
                    New user? <a href="login.html?signup=true" style="color:#7aa9ff;">Sign up here</a>
                </div>
            </div>

            <!-- Activation Form (shown when admin/driver needs to set password) -->
            <div id="activationContainer" style="display:none; margin-top:20px;">
                <h3>🔐 Account Activation</h3>
                <p id="activationMessage" class="activation-message"></p>
                <div id="activationForm">
                    <div class="login-form-group">
                        <input id="activationPassword" type="password" placeholder="Create a new password (min 6 chars)" />
                    </div>
                    <div class="login-form-group">
                        <input id="activationConfirm" type="password" placeholder="Confirm your password" />
                    </div>
                    <button class="btn-success" id="activateBtn" style="width:100%;">
                        <i class="fas fa-check"></i> Activate Account
                    </button>
                    <div id="activationError" class="error-msg" style="text-align:center; margin-top:10px;"></div>
                </div>
                <div id="activationSuccess" style="display:none;">
                    <div class="activation-box">
                        <div class="success-icon">✅</div>
                        <p id="activationSuccessMessage" style="color:#2ecc71; font-weight:600; font-size:1.1rem;"></p>
                        <p style="color:rgba(255,255,255,0.5); font-size:0.9rem; margin-top:8px;">
                            You will be automatically logged in...
                        </p>
                    </div>
                </div>
            </div>

            <!-- Signup Form (for users) -->
            <div id="signupContainer" style="display:none; margin-top:20px;">
                <h3>Sign Up</h3>
                <div class="login-form-group">
                    <input id="signupName" type="text" placeholder="Your full name" />
                </div>
                <div class="login-form-group">
                    <input id="signupUsername" type="text" placeholder="Choose a username" />
                </div>
                <div class="login-form-group">
                    <input id="signupPassword" type="password" placeholder="Choose a password" />
                </div>
                <button class="btn-success" id="signupBtn" style="width:100%;">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
                <div id="signupError" class="error-msg" style="text-align:center; margin-top:10px;"></div>
                <div style="text-align:center; margin-top:12px; font-size:0.85rem; color:rgba(255,255,255,0.3);">
                    Already have an account? <a href="login.html" style="color:#7aa9ff;">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js" type="module"></script>
    <script>
        document.getElementById('homeBtn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
        document.getElementById('homeLink').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
