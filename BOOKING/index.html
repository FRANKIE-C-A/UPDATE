<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Booking System</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-title" id="homeLink">
                <i class="fas fa-bus"></i> Bus<span style="-webkit-text-fill-color: #ffd700;">Book</span>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="user-badge" id="userBadge" style="display:none;">
                    <i class="fas fa-user-circle"></i>
                    <span id="userBadgeName">Guest</span>
                </div>
                <button class="hamburger" id="hamburgerBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <div class="dropdown-menu" id="dropdownMenu">
            <a href="login.html" class="menu-item" id="menuLogin"><i class="fas fa-sign-in-alt"></i> Login</a>
            <a href="#" class="menu-item" id="menuLogout" style="display:none;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            <div class="dropdown-divider"></div>
            <a href="book.html" class="menu-item"><i class="fas fa-ticket"></i> Book</a>
            <a href="track.html" class="menu-item"><i class="fas fa-map-location-dot"></i> Track</a>
            <a href="admin.html" class="menu-item" id="menuAdmin" style="display:none;"><i class="fas fa-user-shield"></i> Admin Panel</a>
            <a href="driver.html" class="menu-item" id="menuDriver" style="display:none;"><i class="fas fa-steering-wheel"></i> Driver Panel</a>
            <a href="owner.html" class="menu-item" id="menuOwner" style="display:none;"><i class="fas fa-crown"></i> Owner Panel</a>
        </div>

        <div class="hero">
            <h1>🚌 Bus Booking System</h1>
            <p>Book your ride, track your bus, and travel with ease.</p>
            <div class="hero-buttons">
                <a href="book.html" class="btn-primary"><i class="fas fa-ticket"></i> Book Now</a>
                <a href="track.html" class="btn-secondary"><i class="fas fa-map-location-dot"></i> Track Bus</a>
            </div>
        </div>

        <div class="card glass">
            <h4><i class="fas fa-bus"></i> Available Trips</h4>
            <div id="homeTripList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin:12px 0;"></div>
        </div>

        <div id="homeStatsContainer" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card"><i class="fas fa-users"></i><span class="num" id="homeUsers">0</span><label>Users</label></div>
                <div class="stat-card"><i class="fas fa-bus"></i><span class="num" id="homeDrivers">0</span><label>Drivers</label></div>
                <div class="stat-card"><i class="fas fa-ticket"></i><span class="num" id="homeBookings">0</span><label>Bookings</label></div>
                <div class="stat-card"><i class="fas fa-route"></i><span class="num" id="homeRoutes">0</span><label>Routes</label></div>
            </div>
            <div class="card glass">
                <h4><i class="fas fa-clock"></i> Recent Bookings</h4>
                <div class="table-wrap"><table><thead><tr><th>Passenger</th><th>Route</th><th>Status</th><th>Time</th></tr></thead><tbody id="homeRecentBookings"></tbody></table></div>
            </div>
        </div>

        <div id="homeUserMessage" class="card glass text-center" style="display:none;">
            <p style="font-size:1.2rem;color:rgba(255,255,255,0.7);">
                <i class="fas fa-smile"></i> Welcome! Please <a href="login.html" style="color:#7aa9ff;">log in</a> or <a href="login.html?signup=true" style="color:#7aa9ff;">sign up</a> to book your bus.
            </p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="script.js"></script>
    <script>
        // Index page logic
        document.addEventListener('DOMContentLoaded', async function() {
            await checkSession();
            await refreshAllData();
            updateBadge();
            updateHomePage();
            loadTripsToHome();

            document.getElementById('homeLink').addEventListener('click', function() {
                window.location.href = 'index.html';
            });
        });

        function updateHomePage() {
            document.getElementById('homeUsers').textContent = allUsers.filter(u => u.role === 'user').length;
            document.getElementById('homeDrivers').textContent = allDrivers.length;
            document.getElementById('homeBookings').textContent = allBookings.length;
            document.getElementById('homeRoutes').textContent = allRoutes.length;

            const tbody = document.getElementById('homeRecentBookings');
            tbody.innerHTML = '';
            allBookings.slice(0, 10).forEach(b => {
                const tr = document.createElement('tr');
                const time = b.createdAt?.toDate?.() ? b.createdAt.toDate().toLocaleString() : '—';
                tr.innerHTML =
                    `<td>${b.passengerName || '—'}</td><td>${b.routeName || '—'}</td><td><span class="badge badge-${b.status?.toLowerCase() || 'pending'}">${b.status || 'Pending'}</span></td><td>${time}</td>`;
                tbody.appendChild(tr);
            });
        }

        function loadTripsToHome() {
            const list = document.getElementById('homeTripList');
            list.innerHTML = '';
            allDrivers.forEach(d => {
                const route = allRoutes.find(r => r.rid === d.routeId);
                if (route) {
                    const card = document.createElement('div');
                    card.className = 'trip-card';
                    card.innerHTML = `
                        <div style="font-size:1.2rem;font-weight:600;color:#7aa9ff;">${route.name}</div>
                        <div><i class="fas fa-bus"></i> ${(d.busType || 'STANDARD').toUpperCase()}</div>
                        <div><i class="fas fa-coins"></i> ₱${d.fare || 0}</div>
                        <div><i class="fas fa-clock"></i> ${d.departureTime || '08:00'}</div>
                        <a href="book.html?driver=${d.did}" class="btn-primary" style="padding:6px 12px;font-size:0.8rem;margin-top:8px;text-decoration:none;display:inline-block;">Book Now</a>
                    `;
                    list.appendChild(card);
                }
            });
        }
    </script>
</body>
</html>
