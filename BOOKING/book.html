<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Bus</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-title" id="homeLink">
                <i class="fas fa-bus"></i> Bus<span style="-webkit-text-fill-color: #ffd700;">Book</span>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="user-badge" id="userBadge" style="display:none;">
                    <i class="fas fa-user-circle"></i>
                    <span id="userBadgeName">Guest</span>
                </div>
                <button class="hamburger" id="hamburgerBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
            <a href="login.html" class="menu-item" id="menuLogin"><i class="fas fa-sign-in-alt"></i> Login</a>
            <a href="#" class="menu-item" id="menuLogout" style="display:none;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            <div class="dropdown-divider"></div>
            <a href="track.html" class="menu-item"><i class="fas fa-map-location-dot"></i> Track</a>
            <a href="admin.html" class="menu-item" id="menuAdmin" style="display:none;"><i class="fas fa-user-shield"></i> Admin Panel</a>
            <a href="driver.html" class="menu-item" id="menuDriver" style="display:none;"><i class="fas fa-steering-wheel"></i> Driver Panel</a>
            <a href="owner.html" class="menu-item" id="menuOwner" style="display:none;"><i class="fas fa-crown"></i> Owner Panel</a>
        </div>

        <div class="card glass">
            <h3><i class="fas fa-ticket"></i> Book a Bus</h3>
            <form id="bookingForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Passenger Name</label>
                    <input id="pName" placeholder="Enter your full name" required />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-route"></i> Select Trip</label>
                    <select id="pTrip" required>
                        <option value="">— Select a trip —</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-bus"></i> Bus Type</label>
                        <p id="selectedBusType" style="padding:8px 0;color:rgba(255,255,255,0.7);">—</p>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-coins"></i> Fare</label>
                        <p id="selectedFare" style="padding:8px 0;color:rgba(255,255,255,0.7);">—</p>
                    </div>
                </div>
                <p style="font-size:0.85rem;color:rgba(255,255,255,0.4);"><i class="fas fa-info-circle"></i> Seats are assigned automatically based on availability.</p>
                <button type="submit" class="btn-primary"><i class="fas fa-check"></i> Book Now</button>
            </form>
        </div>

        <div id="confirmation" class="card glass hidden">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                <i class="fas fa-check-circle" style="font-size:2rem;color:#2ecc71;"></i>
                <h3 style="margin:0;">Booking Confirmed!</h3>
            </div>
            <div id="confirmText" class="info-box"></div>

            <div class="info-box">
                <h4><i class="fas fa-info-circle"></i> Driver Info</h4>
                <p id="driverInfo">Waiting for driver assignment…</p>
            </div>

            <div class="info-box">
                <h4><i class="fas fa-chair"></i> Seat Availability</h4>
                <div id="seatGrid" class="seat-grid"></div>
            </div>

            <div class="info-box">
                <h4><i class="fas fa-clock"></i> Estimated Arrival</h4>
                <p id="etaText">Calculating ETA…</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js" type="module"></script>
    <script>
        document.getElementById('homeLink').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
